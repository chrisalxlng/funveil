<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unexpected Error</title>
    <style>
      :root {
        --primary: #c5202c;
        --background: #ffffff;
        --typography-attention: #1a1a1a;
        --typography-subtle: #666666;
        --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        background-color: var(--background);
        font-family: var(--font-sans);
        color: var(--typography-attention);
        text-align: center;
      }

      .container {
        max-width: 400px;
        animation: fadeIn 0.6s ease-out;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .inner-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
        margin-bottom: 50px;
      }

      .status-code {
        font-size: 8rem;
        font-weight: 900;
        margin: 0;
        line-height: 1;
        color: var(--primary);
        opacity: 0.15;
        letter-spacing: -0.05em;
      }

      h1 {
        font-size: 2.5rem;
        font-weight: 800;
        margin: -2.5rem 0 1rem 0;
        letter-spacing: -0.02em;
      }

      p {
        color: var(--typography-subtle);
        line-height: 1.6;
        margin-top: 0;
        margin-bottom: 0;
      }

      .error-message {
        font-family: monospace;
        background: #f4f4f4;
        padding: 0.5rem;
        border-radius: 4px;
        font-size: 0.85rem;
      }

      .btn {
        display: inline-block;
        background-color: var(--primary);
        color: white;
        text-decoration: none;
        padding: 0.75rem 2rem;
        border-radius: 8px;
        font-weight: 700;
        transition:
          transform 0.2s,
          filter 0.2s;
      }

      .btn:hover {
        transform: scale(1.01);
        filter: brightness(1.1);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p class="status-code">%sveltekit.status%</p>
      <h1>Unexpected Error</h1>
      <div class="inner-container">
        <p>Something went wrong on our end.</p>
        <span class="error-message">%sveltekit.error.message%</span>
      </div>
      <a href="/" class="btn">Return Home</a>
    </div>
  </body>
</html>
